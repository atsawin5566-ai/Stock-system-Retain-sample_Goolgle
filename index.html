<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stock Management System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(
    135deg,
    #eef2ff,
    #f8faff,
    #ffffff
    );
    min-height:100vh;
}

/* SIDEBAR */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:250px;
    height:100%;
    background:linear-gradient(180deg,#4f46e5,#7c3aed);
    color:white;
    padding:20px;
}

.logo{
    font-size:22px;
    font-weight:bold;
    margin-bottom:30px;
}

.menu a{
    display:block;
    text-decoration:none;
    padding:12px;
    color:white;
    margin-bottom:8px;
    border-radius:12px;
}

.menu a:hover{
    background:rgba(255,255,255,0.15);
}

/* MAIN */

.main{
    margin-left:270px;
    padding:25px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.user-box{
    background:white;
    padding:10px 20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

/* DASHBOARD */

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.stat-card h2{
    color:#4f46e5;
    font-size:30px;
}

.stat-card p{
    color:#64748b;
}

/* CARD */

.card{
    background:white;
    padding:20px;
    border-radius:20px;
    margin-bottom:25px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.card-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:20px;
}

/* FORM */

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
}

input,
select{
    width:100%;
    height:42px;
    padding:10px;
    border-radius:10px;
    border:1px solid #ddd;
}

input:focus,
select:focus{
    outline:none;
    border-color:#4f46e5;
}

/* BUTTON */

.btn{
